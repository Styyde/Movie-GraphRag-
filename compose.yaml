services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-moviegraph-local}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  api:
    image: moviegraphrag:local
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      HF_HOME: /models
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./evaluation:/app/evaluation
      - ./models:/models
    depends_on:
      neo4j:
        condition: service_healthy
  tests:
    profiles: [test]
    image: moviegraphrag:local
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      API_BASE_URL: http://api:8000
      HF_HOME: /models
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/models
      - ./tests:/app/tests:ro
      - ./evaluation:/app/evaluation
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "pytest", "-q", "tests/real"]
volumes:
  neo4j_data:
